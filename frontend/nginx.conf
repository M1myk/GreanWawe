server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/v1/ {
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $http_host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
