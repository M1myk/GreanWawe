spring.application.name=greenwave
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
greenwave.cors.allowed-origins=${GREENWAVE_CORS_ALLOWED_ORIGINS:http://localhost:5173}

spring.datasource.url=${GREENWAVE_DB_URL:jdbc:sqlite:greenwave.db?foreign_keys=on&busy_timeout=5000}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
