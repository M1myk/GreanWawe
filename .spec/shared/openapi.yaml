    "/traffic": {
      "get": {
        "operationId": "getSimulatedTraffic",
        "parameters": [
          {
            "in": "query",
            "name": "networkId",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "in": "query",
            "name": "mode",
            "required": true,
            "schema": {
              "type": "string",
              "enum": [
                "NONE",
                "NORMAL",
                "RUSH_HOUR"
              ]
            }
          },
          {
            "in": "query",
            "name": "seed",
            "schema": {
              "type": "integer",
              "minimum": 0,
              "maximum": 2147483647,
              "default": 42
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Simulated traffic overlay keyed by directed road edge",
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": {
                    "type": "object",
                    "required": [
                      "edgeId",
                      "speedFactor",
                      "heavy"
                    ],
                    "properties": {
                      "edgeId": {
                        "type": "string"
                      },
                      "speedFactor": {
                        "type": "number",
                        "exclusiveMinimum": 0,
                        "exclusiveMaximum": 1,
                        "description": "Estimated mean queue speed divided by the posted limit."
                      },
                      "heavy": {
                        "type": "boolean",
                        "description": "Whether the overlay marks the corridor as heavy congestion."
                      }
                    }
                  }
                }
              }
