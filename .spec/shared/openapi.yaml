                    "lengthM"
                  ],
                  "properties": {
                    "geometry": {
                      "type": "array",
                      "items": {
                        "type": "array",
                        "items": {
                          "type": "number"
                        },
                        "minItems": 2,
                        "maxItems": 2
                      }
                    },
                    "lengthM": {
                      "type": "number",
                      "minimum": 0
                    }
                  }
                }
              }
            }
          },
          "404": {
            "description": "Network or endpoint not found"
          },
          "422": {
            "description": "No directed road route"
          }
        }
      }
