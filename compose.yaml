name: greenwave

services:
  backend:
    build: ./backend
    environment:
      SERVER_ADDRESS: 0.0.0.0
      GREENWAVE_DB_URL: "jdbc:sqlite:/data/greenwave.db?foreign_keys=on&busy_timeout=5000"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-3.5-flash-lite}"
    volumes:
      - type: bind
        source: ${GREENWAVE_DATA_DIR:-./state/docker}
        target: /data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_MAP_TILE_URL: "${VITE_MAP_TILE_URL:-}"
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${GREENWAVE_PORT:-3000}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/v1/health"]
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 15s
